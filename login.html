<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión — Ecom Studio IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background:#0d1117; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
    .grad-text { background:linear-gradient(135deg,#a78bfa,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .grad-btn  { background:linear-gradient(135deg,#8b5cf6,#3b82f6); }
    .grad-btn:hover { opacity:.88; }
    .grad-btn:disabled { opacity:.5; cursor:not-allowed; }
    .input-field {
      width:100%; padding:11px 14px 11px 40px;
      background:#1c2128; border:1px solid #30363d;
      border-radius:10px; color:#e6edf3; font-size:14px;
      outline:none; transition:border-color .2s, box-shadow .2s;
    }
    .input-field::placeholder { color:#6b7280; }
    .input-field:focus { border-color:#8b5cf6; box-shadow:0 0 0 3px rgba(139,92,246,.12); }
    .input-field.error { border-color:#ef4444; }
    .input-wrap { position:relative; }
    .input-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#6b7280; font-size:15px; pointer-events:none; }
    .toggle-pw { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#6b7280; cursor:pointer; font-size:16px; }
    .toggle-pw:hover { color:#a78bfa; }
    .field-error { font-size:12px; color:#f87171; margin-top:4px; display:none; }
    .field-error.show { display:block; }
    .toast { position:fixed; top:20px; right:20px; z-index:9999; padding:12px 18px; border-radius:12px; font-size:14px; font-weight:500; max-width:320px; opacity:0; transform:translateX(100%); transition:all .3s ease; }
    .toast.show { opacity:1; transform:translateX(0); }
    .toast-success { background:#1a2e1a; border:1px solid #22c55e; color:#4ade80; }
    .toast-error   { background:#2e1a1a; border:1px solid #ef4444; color:#f87171; }
    .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; display:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    label { display:block; font-size:13px; font-weight:500; color:#c9d1d9; margin-bottom:6px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center py-10 px-4">

<div id="toast" class="toast"></div>

<div class="w-full max-w-sm">

  <!-- Logo -->
  <div class="text-center mb-8">
    <a href="index.html" class="inline-flex items-center gap-2 justify-center mb-4">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="url(#lg-l)"/><defs><linearGradient id="lg-l" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><path d="M14 3L8 13H12L7 21L18 11H14L14 3Z" fill="white"/></svg>
      <span class="font-bold text-[18px]" style="color:#e6edf3">Ecom Studio <span class="grad-text">IA</span></span>
    </a>
    <h1 class="text-2xl font-bold" style="color:#e6edf3">Bienvenido de vuelta</h1>
    <p class="text-sm mt-1" style="color:#8b949e">Inicia sesión en tu cuenta</p>
  </div>

  <form id="loginForm" novalidate>
    <!-- Email -->
    <div class="mb-4">
      <label for="email">Correo electrónico</label>
      <div class="input-wrap">
        <span class="input-icon">✉️</span>
        <input id="email" type="email" class="input-field" placeholder="you@email.com" autocomplete="email"/>
      </div>
      <p class="field-error" id="err-email">Ingresa tu email</p>
    </div>

    <!-- Password -->
    <div class="mb-2">
      <div class="flex items-center justify-between mb-1.5">
        <label for="password" style="margin-bottom:0">Contraseña</label>
        <a href="#" class="text-[12px] text-purple-400 hover:text-purple-300 transition-colors">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input id="password" type="password" class="input-field" placeholder="Tu contraseña" autocomplete="current-password"/>
        <button type="button" class="toggle-pw" onclick="togglePw()">👁️</button>
      </div>
      <p class="field-error" id="err-password">Ingresa tu contraseña</p>
    </div>

    <!-- Server error -->
    <p class="field-error show mb-4 text-center" id="err-server" style="display:none"></p>

    <div class="mt-5">
      <button type="submit" id="submitBtn" class="grad-btn w-full py-3 rounded-xl text-white font-bold text-[15px] transition-opacity flex items-center justify-center gap-3">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Iniciar sesión</span>
      </button>
    </div>

    <p class="text-center text-[13px] mt-4" style="color:#6b7280">
      ¿No tienes cuenta?
      <a href="register.html" class="text-purple-400 hover:text-purple-300 font-medium transition-colors">Crear cuenta gratis</a>
    </p>
  </form>

  <!-- Admin hint card -->
  <div class="mt-6 p-4 rounded-xl border text-center" style="background:rgba(139,92,246,.05);border-color:rgba(139,92,246,.2)">
    <p class="text-[11px] font-semibold uppercase tracking-wider mb-2" style="color:#6b7280">Acceso Admin</p>
    <p class="text-[12px]" style="color:#8b949e">admin@ecommagic.ai<br>Admin1234!</p>
  </div>
</div>

<script>
  const API = 'http://localhost:3000/api';

  if (localStorage.getItem('token')) {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
  }

  function togglePw() {
    const el = document.getElementById('password');
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast toast-${type} show`;
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  function setLoading(on) {
    document.getElementById('spinner').style.display = on ? 'block' : 'none';
    document.getElementById('btnText').textContent = on ? 'Iniciando...' : 'Iniciar sesión';
    document.getElementById('submitBtn').disabled = on;
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    ['email','password','server'].forEach(f => {
      const el = document.getElementById('err-' + f);
      if (el) { el.style.display = 'none'; el.classList.remove('show'); }
    });
    ['email','password'].forEach(f => document.getElementById(f)?.classList.remove('error'));

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!email) { document.getElementById('err-email').classList.add('show'); document.getElementById('email').classList.add('error'); valid = false; }
    if (!password) { document.getElementById('err-password').classList.add('show'); document.getElementById('password').classList.add('error'); valid = false; }
    if (!valid) return;

    setLoading(true);
    try {
      const res  = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const json = await res.json();
      if (!res.ok) {
        const err = document.getElementById('err-server');
        err.textContent = json.error || 'Error al iniciar sesión';
        err.style.display = 'block'; err.classList.add('show');
      } else {
        localStorage.setItem('token', json.token);
        localStorage.setItem('user',  JSON.stringify(json.user));
        showToast('¡Sesión iniciada!', 'success');
        setTimeout(() => {
          window.location.href = json.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
        }, 1000);
      }
    } catch {
      const err = document.getElementById('err-server');
      err.textContent = 'No se pudo conectar al servidor.';
      err.style.display = 'block'; err.classList.add('show');
    } finally {
      setLoading(false);
    }
  });
</script>
</body>
</html>
